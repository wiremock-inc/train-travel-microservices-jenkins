arazzo: 1.0.1
info:
  title: Rail Reservations workflows
  version: 1.0.0
sourceDescriptions:
  - name: bookings
    url: ./openapi.json
    type: openapi
workflows:
  - workflowId: reservationLifecycle
    summary: Hold a trip, confirm it after payment, check it is private to its holder, then release a second hold
    steps:
      - stepId: createHold
        operationId: createReservation
        parameters:
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        requestBody:
          contentType: application/json
          payload:
            tripRef: 3f0d5c1e-8b2a-5c4d-9e6f-0a1b2c3d4e5f
            passengerName: Jane Smith
            bicycle: true
            dog: false
            holderId: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'HELD'
          - condition: $response.body#/passengerName == 'Jane Smith'
        outputs:
          reservationId: $response.body#/reservationId
      - stepId: getHold
        operationId: getReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/reservationId == $steps.createHold.outputs.reservationId
          - condition: $response.body#/bicycle == true
      - stepId: listHolds
        operationId: listReservations
        parameters:
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 200
          - context: $response.body
            type: jsonpath
            condition: $.reservations[?(@.passengerName == 'Jane Smith')]
      - stepId: confirmHold
        operationId: confirmReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'CONFIRMED'
      - stepId: getConfirmed
        operationId: getReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'CONFIRMED'
      - stepId: otherHolderCannotSee
        operationId: getReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-2
        successCriteria:
          - condition: $statusCode == 404
      - stepId: createSecondHold
        operationId: createReservation
        parameters:
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        requestBody:
          contentType: application/json
          payload:
            tripRef: 7a1e9b20-4c3d-5e6f-8a9b-0c1d2e3f4a5b
            passengerName: John Doe
            holderId: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/status == 'HELD'
        outputs:
          reservationId: $response.body#/reservationId
      - stepId: releaseSecondHold
        operationId: deleteReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createSecondHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 204
      - stepId: releasedHoldIsGone
        operationId: getReservation
        parameters:
          - name: reservationId
            in: path
            value: $steps.createSecondHold.outputs.reservationId
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 404
      - stepId: deleteUnknown
        operationId: deleteReservation
        parameters:
          - name: reservationId
            in: path
            value: 00000000-0000-4000-8000-000000000000
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 404
      - stepId: confirmUnknown
        operationId: confirmReservation
        parameters:
          - name: reservationId
            in: path
            value: 00000000-0000-4000-8000-000000000000
          - name: X-User-Id
            in: header
            value: user-arazzo-1
        successCriteria:
          - condition: $statusCode == 404
