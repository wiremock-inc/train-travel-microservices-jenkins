---
mappings:
- id: "de21d9ab-8a6e-4337-9c04-6832ce06a9bc"
  name: "Not found - get reservation"
  request:
    urlPathTemplate: "/reservations/{reservationId}"
    method: "GET"
    customMatcher:
      name: "custom-and-matcher"
      parameters:
        matchers:
        - name: "require-state"
          parameters:
            requirements:
            - key: "{{request.path.reservationId}}"
              absent: true
              context: "reservations:{{request.headers.x-user-id}}"
  response:
    status: 404
  priority: 2
- id: "da84208f-7d6b-41ba-aa91-ddd283f5cdf5"
  name: "Not found - delete reservation"
  request:
    urlPathTemplate: "/reservations/{reservationId}"
    method: "DELETE"
    customMatcher:
      name: "custom-and-matcher"
      parameters:
        matchers:
        - name: "require-state"
          parameters:
            requirements:
            - key: "{{request.path.reservationId}}"
              absent: true
              context: "reservations:{{request.headers.x-user-id}}"
  response:
    status: 404
  priority: 2
- id: "5e9a1ac5-e35f-4a23-a3a2-8681a9dd5e60"
  name: "Not found - confirm reservation"
  request:
    urlPathTemplate: "/reservations/{reservationId}/confirm"
    method: "POST"
    customMatcher:
      name: "custom-and-matcher"
      parameters:
        matchers:
        - name: "require-state"
          parameters:
            requirements:
            - key: "{{request.path.reservationId}}"
              absent: true
              context: "reservations:{{request.headers.x-user-id}}"
  response:
    status: 404
  priority: 2
- id: "6e83e894-0cc0-4485-9b80-cc18f162ed6d"
  name: "Create a reservation (hold)"
  request:
    urlPathTemplate: "/reservations"
    method: "POST"
  response:
    status: 201
    bodyFileName: "create-a-reservation-hold-6e83e8.json"
    headers:
      Content-Type: "application/json"
    transformers:
    - "response-template"
  serveEventListeners:
  - name: "change-state"
    parameters:
      operations:
      - context: "local"
        key: "id"
        operation: "REQUEST_VAR"
        phase: "AFTER_MATCH"
        value: "{{randomValue type='UUID'}}"
      - context: "local"
        key: "collectionContext"
        operation: "REQUEST_VAR"
        phase: "AFTER_MATCH"
        value: "reservations:{{request.headers.x-user-id}}"
      - context: "{{collectionContext}}"
        key: "{{id}}"
        operation: "SET"
        phase: "AFTER_MATCH"
        value: |-
          {{#jsonMerge request.body}}
          {
            "reservationId" : "{{id}}",
            "status" : "HELD",
            "createdAt" : "{{now format="yyyy-MM-dd'T'HH:mm:ss'Z'"}}",
            "expiresAt" : "{{now offset='1 hours' format="yyyy-MM-dd'T'HH:mm:ss'Z'"}}"
          }
          {{/jsonMerge}}
