      parameters:
        matchers:
        - name: "require-state"
          parameters:
            requirements:
            - key: "{{request.path.reservationId}}"
              absent: true
              context: "reservations-{{request.headers.X-User-Id}}"
  response:
    status: 404
  priority: 2
- id: "b07e2c80-998c-405b-9f11-369c27a1324a"
  name: "Delete reservation - not found"
  request:
