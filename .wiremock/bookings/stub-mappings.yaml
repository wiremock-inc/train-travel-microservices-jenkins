---
mappings:
- id: "26bcd1e3-bc07-410f-83a3-b355c12124e6"
  name: "Get reservation - not found"
  request:
    urlPathTemplate: "/reservations/{reservationId}"
    method: "GET"
    customMatcher:
      name: "custom-and-matcher"
      parameters:
        matchers:
        - name: "require-state"
          parameters:
            requirements:
            - key: "{{request.path.reservationId}}"
              absent: true
              context: "reservations-{{request.headers.X-User-Id}}"
  response:
    status: 404
  priority: 2
- id: "99f19223-493e-4258-b77f-65b6463548dd"
