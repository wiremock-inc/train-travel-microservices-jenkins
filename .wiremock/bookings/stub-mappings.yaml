- id: "2bf1e653-1263-46f5-a82b-b542d77af05e"
  name: "Create reservation"
  request:
    urlPathTemplate: "/reservations"
    method: "POST"
  response:
    status: 201
    bodyFileName: "create-reservation-2bf1e6.json"
    headers:
      Content-Type: "application/json"
    transformers:
    - "response-template"
  serveEventListeners:
  - name: "change-state"
    parameters:
      operations:
      - context: "local"
        key: "id"
        operation: "REQUEST_VAR"
        phase: "AFTER_MATCH"
        value: "{{randomValue type='UUID'}}"
      - context: "local"
        key: "collectionContext"
        operation: "REQUEST_VAR"
        phase: "AFTER_MATCH"
        value: "reservations-{{request.headers.X-User-Id}}"
      - context: "{{collectionContext}}"
        key: "{{id}}"
        operation: "SET"
        phase: "AFTER_MATCH"
        value: |-
          {{#jsonMerge request.body}}
          {
            "reservationId": "{{id}}",
            "status": "HELD",
            "createdAt": "{{now format="yyyy-MM-dd'T'HH:mm:ss'Z'"}}",
            "expiresAt": "{{now offset='1 hours' format="yyyy-MM-dd'T'HH:mm:ss'Z'"}}"
          }
          {{/jsonMerge}}
