{
  "openapi": "3.0.3",
  "info": {
    "title": "European Rail Reference Data",
    "description": "Internal infrastructure reference-data API serving the master list of European rail stations.",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "https://3z2m01.wiremockapi.cloud"
    }
  ]
  ,
  "paths": {
    "/station-data": {
      "get": {
        "summary": "Query station master data",
        "operationId": "getStationData",
        "parameters": [
          {
            "name": "country",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "ISO 3166-1 alpha-2 country code, exact match"
          },
          {
            "name": "pageSize",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 10,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "default": 0,
              "minimum": 0
            }
          }
        ]
        ,
        "responses": {
          "200": {
            "description": "Matching stations, ordered by stationName ascending",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StationDataResponse"
                },
                "example": {
                  "stations": [
                    {
                      "stationCode": "DE-BER-HBF",
                      "stationName": "Berlin Hauptbahnhof",
                      "addressLines": [
                        "Invalidenstraße 10557",
                        "Berlin"
                      ]
                      ,
                      "countryIsoCode": "DE",
                      "geo": {
                        "latitude": 52.525,
                        "longitude": 13.3694
                      },
                      "tzId": "Europe/Berlin"
                    }
                  ]
                  ,
                  "offset": 0,
                  "pageSize": 10
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "StationData": {
        "type": "object",
        "required": [
          "stationCode",
          "stationName",
          "countryIsoCode",
          "geo",
          "tzId"
        ]
        ,
        "properties": {
          "stationCode": {
            "type": "string",
            "description": "Natural key, format {CC}-{CITY}-{3-LETTER}"
          },
          "stationName": {
            "type": "string"
          },
          "addressLines": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "countryIsoCode": {
            "type": "string"
          },
          "geo": {
            "type": "object",
            "properties": {
              "latitude": {
                "type": "number"
              },
              "longitude": {
                "type": "number"
              }
            }
          },
          "tzId": {
            "type": "string",
            "description": "IANA time zone"
          }
        }
      },
      "StationDataResponse": {
        "type": "object",
        "properties": {
          "stations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StationData"
            }
          },
          "offset": {
            "type": "integer"
          },
          "pageSize": {
            "type": "integer"
          }
        }
      }
    }
  }
}
