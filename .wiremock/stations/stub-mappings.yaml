mappings:
- id: "6b5fda0a-f907-42b1-901a-606d50ece66b"
  name: "All stations (page size covers the full list)"
  request:
    urlPathTemplate: "/station-data"
    method: "GET"
    queryParameters:
      country:
        absent: true
      offset:
        or:
        - equalTo: "0"
        - absent: true
      pageSize:
        matches: "^(1[89]|[2-9][0-9]|100)$"
  response:
    status: 200
    bodyFileName: "all-stations-page-size-covers-the-full-list-6b5fda.json"
    headers:
      Content-Type: "application/json"
    transformers:
    - "response-template"
  priority: 5
