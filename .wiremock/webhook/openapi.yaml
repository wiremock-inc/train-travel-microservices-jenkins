openapi: 3.0.3
info:
  title: Train Travel Webhook Receiver
  description: |
    Receives the Train Travel API's newBooking webhook. The gateway POSTs each newly created
    booking here; the receiver acknowledges it with a 200. The payload is the newBooking webhook
    request body from the Train Travel API description.
  version: 1.0.0
servers:
- url: https://y1qqv.local.wiremock.cloud
paths:
  /new-booking:
    post:
      operationId: receiveNewBooking
      summary: Receive a newBooking webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
            example:
              id: 1725ff48-ab45-4bb5-9d02-88745177dedb
              trip_id: efdbb9d1-02c2-4bc3-afb7-6788d8782b1e
              passenger_name: Jane Smith
              has_bicycle: true
              has_dog: false
              links:
                self: http://localhost:8080/bookings/1725ff48-ab45-4bb5-9d02-88745177dedb
      responses:
        '200':
          description: The webhook was received
components:
  schemas:
    NewBooking:
      description: A booking for a train trip, as sent by the newBooking webhook.
      type: object
      properties:
        id: {
          type: string,
          format: uuid,
          description: Unique identifier for the booking
        }
        trip_id: {
          type: string,
          format: uuid,
          description: Identifier of the booked trip
        }
        passenger_name: {
          type: string,
          description: Name of the passenger
        }
        has_bicycle: {
          type: boolean,
          description: Indicates whether the passenger has a bicycle.
        }
        has_dog: {
          type: boolean,
          description: Indicates whether the passenger has a dog.
        }
        links:
          type: object
          properties:
            self: {
              type: string,
              format: uri
            }
            next: {
              type: string,
              format: uri
            }
            prev: {
              type: string,
              format: uri
            }
