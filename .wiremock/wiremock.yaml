services:
  stripe:
    template: org/stripe
    name: 'stripe'
    port: 8080
  google-idp:
    template: org/google-sign-in
    name: 'google-idp'
    port: 8081
  stations:
    type: 'REST'
    name: 'stations'
    path: './stations'
    port: 8082
  trips:
    type: 'REST'
    name: 'trips'
    path: './trips'
    port: 8083
  bookings:
    type: 'REST'
    name: 'bookings'
    path: './bookings'
    port: 8084
  payrail:
    type: 'Unstructured'
    name: 'payrail'
    path: './payrail'
    port: 8085
  webhook:
    type: 'REST'
    name: 'webhook'
    path: './webhook'
    port: 8086
